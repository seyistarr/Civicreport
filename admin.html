<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CivicReport Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-primary: #0B0F19;
            --bg-secondary: #111827;
            --bg-card: #161b28;
            --bg-input: #1e2433;
            --text-primary: #FFFFFF;
            --text-secondary: #b0b8c8;
            --text-muted: #6b7280;
            --danger: #EF4444;
            --success: #10B981;
            --accent: #6366f1;
            --border: #2a3040;
            --radius: 12px;
            --radius-sm: 8px;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Inter', sans-serif; background:var(--bg-primary); color:var(--text-primary); min-height:100vh; }
        .container { max-width:1200px; margin:0 auto; padding:20px; }
        .btn { padding:10px 20px; border-radius:var(--radius-sm); font-weight:600; border:none; cursor:pointer; transition:0.2s; font-family:'Inter', sans-serif; display:inline-flex; align-items:center; gap:6px; }
        .btn-primary { background:var(--accent); color:#fff; }
        .btn-danger { background:var(--danger); color:#fff; }
        .btn-success { background:var(--success); color:#fff; }
        .btn-outline { background:transparent; border:1px solid var(--border); color:var(--text-primary); }
        .btn-sm { padding:6px 12px; font-size:0.8rem; }
        .badge { padding:4px 10px; border-radius:20px; font-size:0.75rem; font-weight:600; display:inline-flex; align-items:center; gap:4px; }
        .badge-warning { background:rgba(245,158,11,0.2); color:#fcd34d; border:1px solid rgba(245,158,11,0.3); }
        .badge-danger { background:rgba(239,68,68,0.2); color:#fca5a5; border:1px solid rgba(239,68,68,0.3); }
        .badge-success { background:rgba(16,185,129,0.2); color:#6ee7b7; border:1px solid rgba(16,185,129,0.3); }
        .badge-info { background:rgba(59,130,246,0.2); color:#93c5fd; border:1px solid rgba(59,130,246,0.3); }
        .card { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); padding:20px; margin-bottom:16px; }
        .navbar { height:64px; background:rgba(11,15,25,0.9); backdrop-filter:blur(20px); border-bottom:1px solid var(--border); display:flex; align-items:center; padding:0 20px; }
        .navbar-brand { font-weight:800; font-size:1.3rem; cursor:pointer; }
        .nav-links { display:flex; gap:10px; margin-left:auto; align-items:center; }
        .nav-links a { color:var(--text-secondary); text-decoration:none; padding:8px 12px; border-radius:var(--radius-sm); font-size:0.85rem; cursor:pointer; }
        .nav-links a.active, .nav-links a:hover { color:var(--text-primary); background:rgba(255,255,255,0.05); }
        table { width:100%; border-collapse:collapse; font-size:0.85rem; }
        th { text-align:left; padding:10px; color:var(--text-muted); font-weight:600; border-bottom:1px solid var(--border); }
        td { padding:10px; border-bottom:1px solid var(--border); }
        tr:hover td { background:rgba(255,255,255,0.02); }
        .login-container { max-width:400px; margin:80px auto; }
        input, select { width:100%; padding:12px; background:var(--bg-input); border:1px solid var(--border); border-radius:var(--radius-sm); color:#fff; margin-bottom:10px; font-family:'Inter', sans-serif; }
        .dashboard-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:16px; margin-bottom:24px; }
        .dashboard-stat { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); padding:18px 20px; }
        .dashboard-stat .stat-num { font-size:1.8rem; font-weight:800; }
        .dashboard-stat .stat-desc { color:var(--text-muted); font-size:0.8rem; }
        .toast { position:fixed; top:80px; right:20px; padding:14px 20px; border-radius:var(--radius-sm); font-weight:500; z-index:5000; animation:slideIn 0.3s ease; box-shadow:0 8px 40px rgba(0,0,0,0.6); max-width:380px; }
        .toast-success { background:#065f46; color:#d1fae5; border:1px solid #059669; }
        .toast-error { background:#7f1d1d; color:#fee2e2; border:1px solid #dc2626; }
        @keyframes slideIn { from{opacity:0; transform:translateX(100px);} to{opacity:1; transform:translateX(0);} }
        @media (max-width:768px) { .nav-links { flex-wrap:wrap; gap:4px; } table { font-size:0.7rem; } }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-brand">🛡️ CivicReport Admin</div>
        <div class="nav-links" id="navLinks" style="display:none;">
            <a href="#" onclick="switchAdminTab('dashboard')" class="active" data-tab="dashboard"><i class="fas fa-th-large"></i> Dashboard</a>
            <a href="#" onclick="switchAdminTab('moderation')" data-tab="moderation"><i class="fas fa-gavel"></i> Moderation</a>
            <a href="#" onclick="switchAdminTab('users')" data-tab="users"><i class="fas fa-users"></i> Users</a>
            <a href="#" onclick="switchAdminTab('categories')" data-tab="categories"><i class="fas fa-tags"></i> Categories</a>
            <a href="#" onclick="logout()" style="color:var(--danger);"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </div>
    </nav>

    <div id="loginBox" style="display:flex; align-items:center; justify-content:center; min-height:calc(100vh - 64px);">
        <div class="card" style="width:360px; padding:30px;">
            <h2 style="margin-bottom:20px;"><i class="fas fa-shield-haltered"></i> Admin Login</h2>
            <input type="email" id="email" placeholder="Admin email">
            <input type="password" id="password" placeholder="Password">
            <button class="btn btn-primary" style="width:100%;" onclick="adminLogin()">Sign In</button>
            <p id="loginError" style="color:var(--danger); font-size:0.8rem; margin-top:8px;"></p>
        </div>
    </div>
    <div id="adminContent" class="container" style="display:none; padding-top:20px;"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        (function() {
            const SUPABASE_URL = 'https://dkpivxujzpkrgijnztqj.supabase.co';
            const SUPABASE_KEY = 'sb_publishable_ZFxG1w4BNrc6YDfGip9bxw_x9MbvHm8';
            const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

            let currentUser = null;
            let currentProfile = null;

            function showToast(message, type = 'success') {
                const toast = document.createElement('div');
                toast.className = `toast toast-${type}`;
                toast.textContent = message;
                document.body.appendChild(toast);
                setTimeout(() => { toast.style.opacity = '0'; toast.style.transition = '0.3s'; setTimeout(() => toast.remove(), 300); }, 3500);
            }

            async function adminLogin() {
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value.trim();
                if (!email || !password) {
                    document.getElementById('loginError').textContent = 'Please fill all fields.';
                    return;
                }
                try {
                    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
                    if (error) throw error;
                    currentUser = data.user;
                    const { data: profile, error: profErr } = await supabaseClient.from('profiles').select('*').eq('id', currentUser.id).single();
                    if (profErr || !profile || profile.role !== 'admin') {
                        await supabaseClient.auth.signOut();
                        document.getElementById('loginError').textContent = 'Access denied. Admin account required.';
                        return;
                    }
                    currentProfile = profile;
                    document.getElementById('loginBox').style.display = 'none';
                    document.getElementById('adminContent').style.display = 'block';
                    document.getElementById('navLinks').style.display = 'flex';
                    switchAdminTab('dashboard');
                } catch (err) {
                    document.getElementById('loginError').textContent = err.message || 'Login failed.';
                }
            }

            async function logout() {
                await supabaseClient.auth.signOut();
                window.location.reload();
            }

            async function switchAdminTab(tab) {
                document.querySelectorAll('#navLinks a[data-tab]').forEach(a => a.classList.remove('active'));
                const activeLink = document.querySelector(`[data-tab="${tab}"]`);
                if (activeLink) activeLink.classList.add('active');
                const container = document.getElementById('adminContent');
                switch (tab) {
                    case 'dashboard':
                        container.innerHTML = `
                            <h2><i class="fas fa-tachometer-alt"></i> Admin Dashboard</h2>
                            <div class="dashboard-grid" id="dashGrid"></div>`;
                        loadDashboardStats();
                        break;
                    case 'moderation':
                        container.innerHTML = `
                            <h2><i class="fas fa-gavel"></i> Moderation Queue</h2>
                            <table>
                                <thead><tr><th>Image</th><th>Title</th><th>Category</th><th>Severity</th><th>Reporter</th><th>Actions</th></tr></thead>
                                <tbody id="modTableBody"></tbody>
                            </table>`;
                        loadPendingReports();
                        break;
                    case 'users':
                        container.innerHTML = `
                            <h2><i class="fas fa-users"></i> Users</h2>
                            <table>
                                <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Reputation</th><th>Actions</th></tr></thead>
                                <tbody id="usersTableBody"></tbody>
                            </table>
                            <p style="color:var(--text-muted); margin-top:10px;"><i class="fas fa-info-circle"></i> Email visibility is limited by database permissions. You can see user profiles and roles.</p>`;
                        loadUsers();
                        break;
                    case 'categories':
                        container.innerHTML = `
                            <h2><i class="fas fa-tags"></i> Categories</h2>
                            <div class="dashboard-grid" id="catGrid"></div>`;
                        loadCategories();
                        break;
                }
            }

            async function loadDashboardStats() {
                const { count: totalReports } = await supabaseClient.from('reports').select('*', { count:'exact', head:true });
                const { count: pending } = await supabaseClient.from('reports').select('*', { count:'exact', head:true }).eq('status','pending');
                const { count: verified } = await supabaseClient.from('reports').select('*', { count:'exact', head:true }).eq('verified',true);
                const { count: users } = await supabaseClient.from('profiles').select('*', { count:'exact', head:true });
                document.getElementById('dashGrid').innerHTML = `
                    <div class="dashboard-stat"><div class="stat-num">${totalReports}</div><div class="stat-desc">Total Reports</div></div>
                    <div class="dashboard-stat"><div class="stat-num">${pending}</div><div class="stat-desc">Pending</div></div>
                    <div class="dashboard-stat"><div class="stat-num">${verified}</div><div class="stat-desc">Verified</div></div>
                    <div class="dashboard-stat"><div class="stat-num">${users}</div><div class="stat-desc">Users</div></div>`;
            }

            async function loadPendingReports() {
                const { data, error } = await supabaseClient.from('reports').select('*').eq('status','pending').order('created_at', { ascending:false });
                if (error) { showToast(error.message, 'error'); return; }
                const tbody = document.getElementById('modTableBody');
                if (!data || data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:20px;">No pending reports.</td></tr>';
                    return;
                }
                tbody.innerHTML = data.map(r => `
                    <tr>
                        <td>${r.image_url ? `<img src="${r.image_url}" style="width:40px;height:40px;object-fit:cover;border-radius:6px;" onerror="this.style.display='none'">` : '—'}</td>
                        <td>${r.title}</td>
                        <td>${r.category}</td>
                        <td><span class="badge ${r.severity==='high'||r.severity==='critical'?'badge-danger':'badge-warning'}">${r.severity}</span></td>
                        <td>${r.anonymous ? 'Anonymous' : (r.anonymous_name || 'User')}</td>
                        <td>
                            <button class="btn btn-success btn-sm" onclick="verifyReport(${r.id})"><i class="fas fa-check"></i> Verify</button>
                            <button class="btn btn-danger btn-sm" onclick="rejectReport(${r.id})"><i class="fas fa-times"></i> Reject</button>
                            <button class="btn btn-outline btn-sm" onclick="deleteReport(${r.id})"><i class="fas fa-trash"></i> Delete</button>
                        </td>
                    </tr>
                `).join('');
            }

            window.verifyReport = async function(id) {
                await supabaseClient.from('reports').update({ status:'verified', verified:true }).eq('id',id);
                showToast('Report verified.');
                loadPendingReports();
                loadDashboardStats();
            };
            window.rejectReport = async function(id) {
                await supabaseClient.from('reports').update({ status:'rejected' }).eq('id',id);
                showToast('Report rejected.');
                loadPendingReports();
                loadDashboardStats();
            };
            window.deleteReport = async function(id) {
                if (!confirm('Delete this report permanently?')) return;
                await supabaseClient.from('reports').delete().eq('id',id);
                showToast('Report deleted.');
                loadPendingReports();
                loadDashboardStats();
            };

            async function loadUsers() {
                const { data: profiles, error } = await supabaseClient.from('profiles').select('*');
                if (error) { showToast(error.message, 'error'); return; }
                const tbody = document.getElementById('usersTableBody');
                // We can't fetch emails directly with anon key, so we show a placeholder
                tbody.innerHTML = profiles.map(p => `
                    <tr>
                        <td>${p.full_name || 'N/A'}</td>
                        <td><span style="color:var(--text-muted);">Hidden (email not accessible)</span></td>
                        <td>${p.role}</td>
                        <td>${p.reputation}</td>
                        <td>
                            <select onchange="changeRole('${p.id}', this.value)" style="width:auto; padding:6px;">
                                <option value="user" ${p.role==='user'?'selected':''}>User</option>
                                <option value="moderator" ${p.role==='moderator'?'selected':''}>Moderator</option>
                                <option value="admin" ${p.role==='admin'?'selected':''}>Admin</option>
                            </select>
                        </td>
                    </tr>
                `).join('');
            }
            window.changeRole = async function(userId, newRole) {
                await supabaseClient.from('profiles').update({ role:newRole }).eq('id',userId);
                showToast('Role updated.');
                loadUsers();
            };

            async function loadCategories() {
                const { data, error } = await supabaseClient.from('categories').select('*').order('name');
                if (error) { showToast(error.message, 'error'); return; }
                const container = document.getElementById('catGrid');
                container.innerHTML = data.map(c => `
                    <div class="card" style="text-align:center; padding:16px;">
                        <div style="font-size:2rem;">${getCategoryIcon(c.name)}</div>
                        <div style="font-weight:600; margin:8px 0;">${c.name}</div>
                        <button class="btn btn-outline btn-sm" onclick="editCategory(${c.id})"><i class="fas fa-edit"></i> Edit</button>
                    </div>
                `).join('');
            }
            function getCategoryIcon(name) {
                const map = { 'Fire':'<i class="fas fa-fire" style="color:#EF4444;"></i>', 'Flood':'<i class="fas fa-water" style="color:#3B82F6;"></i>', 'Accident':'<i class="fas fa-car-burst" style="color:#F59E0B;"></i>', 'Crime':'<i class="fas fa-gun" style="color:#EF4444;"></i>', 'Road Issue':'<i class="fas fa-road" style="color:#F59E0B;"></i>', 'Electricity':'<i class="fas fa-bolt" style="color:#6366f1;"></i>' };
                return map[name] || '<i class="fas fa-tag"></i>';
            }
            window.editCategory = async function(id) {
                const newName = prompt('Enter new category name:');
                if (newName) {
                    await supabaseClient.from('categories').update({ name:newName }).eq('id',id);
                    showToast('Category updated.');
                    loadCategories();
                }
            };

            // Expose globally
            window.switchAdminTab = switchAdminTab;
            window.adminLogin = adminLogin;
            window.logout = logout;

            // Check existing session on load
            (async () => {
                const { data: { user } } = await supabaseClient.auth.getUser();
                if (user) {
                    currentUser = user;
                    const { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', user.id).single();
                    if (profile && profile.role === 'admin') {
                        currentProfile = profile;
                        document.getElementById('loginBox').style.display = 'none';
                        document.getElementById('adminContent').style.display = 'block';
                        document.getElementById('navLinks').style.display = 'flex';
                        switchAdminTab('dashboard');
                    }
                }
            })();
        })();
    </script>
</body>
